name: Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch PR Description for Changelog
        id: pr_data
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            if (prs.data.length > 0) {
              const body = prs.data[0].body || "";
              core.setOutput('body', body);
            } else {
              core.setOutput('body', "");
            }

      - name: Build and Publish
        run: |
          PROJECT_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | xargs)
          
          if git rev-parse "v$PROJECT_VERSION" >/dev/null 2>&1; then
            echo "Version v$PROJECT_VERSION already published. Skipping deployment."
            exit 0
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN ==="
            echo "Changelog text gathered:"
            echo "${{ steps.pr_data.outputs.body }}"
            echo "Running Gradle simulation..."
            ./gradlew build publish publishMods --dry-run
          else
            echo "=== RELEASE ==="
            ./gradlew build publish publishMods
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_CHANGELOG: ${{ steps.pr_data.outputs.body }}